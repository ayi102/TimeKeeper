<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TimeKeeper</title>
  <style>
    :root {
      --bg:#0b1020; --panel:#181f3a; --panel-2:#2a3357; --text:#f1f5f9;
      --muted:#9aa6c4; --green:#22c55e; --indigo:#6366f1; --violet:#a855f7;
      --grad:linear-gradient(135deg,#6366f1,#a855f7);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; }
    body {
      font-family:-apple-system,"Roboto",sans-serif; color:var(--text);
      user-select:none; display:flex; flex-direction:column;
      height:100vh; overflow:hidden;
      background:
        radial-gradient(900px 520px at 12% -8%, rgba(99,102,241,.32), transparent 60%),
        radial-gradient(820px 520px at 108% 4%, rgba(168,85,247,.24), transparent 55%),
        radial-gradient(700px 500px at 50% 120%, rgba(56,189,248,.12), transparent 60%),
        var(--bg);
      background-attachment:fixed;
    }
    .topbar {
      display:flex; align-items:center; gap:1.1rem; padding:1.5rem 1.75rem;
      background:rgba(24,31,58,.72); backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(148,163,247,.15);
    }
    .avatar {
      width:76px; height:76px; border-radius:50%; object-fit:cover; cursor:pointer;
      border:2px solid rgba(148,163,247,.5); box-shadow:0 4px 14px rgba(99,102,241,.45);
      transition:transform .08s ease;
    }
    .avatar:active { transform:scale(.92); }
    .brand {
      font-weight:800; font-size:1.5rem; letter-spacing:.3px;
      background:linear-gradient(135deg,#818cf8,#c084fc);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }
    .byline { font-weight:400; color:var(--muted); font-size:.62em; -webkit-text-fill-color:var(--muted); }
    .adminbtn {
      margin-left:auto; background:var(--grad); color:#fff; border:none;
      border-radius:12px; padding:.6rem 1.2rem; font-size:1rem; font-weight:700; cursor:pointer;
      box-shadow:0 6px 18px rgba(99,102,241,.4);
    }
    .adminbtn:active { transform:scale(.97); }
    .topright { text-align:right; line-height:1.2; }
    .clock { font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .date { color:var(--muted); font-size:.9rem; }
    main { flex:1; padding:1.5rem; overflow-y:auto; }
    .prompt { text-align:center; font-size:1.6rem; font-weight:700; margin:.25rem 0 1.5rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1.25rem; }
    .namecard {
      position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:.6rem; min-height:150px; border-radius:18px;
      background:linear-gradient(160deg, rgba(42,52,98,.85), rgba(22,29,58,.9));
      padding:1.25rem; border:1px solid rgba(148,163,247,.18); cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.28);
      transition:transform .08s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .namecard:active { transform:scale(.97); }
    .namecard-name { font-size:1.6rem; font-weight:800; text-align:center; }
    .namecard-status { font-size:1rem; color:var(--muted); font-weight:600; }
    .namecard.is-in {
      border-color:rgba(34,197,94,.6);
      box-shadow:0 10px 28px rgba(34,197,94,.28);
      background:linear-gradient(160deg, rgba(22,74,52,.75), rgba(20,40,45,.85));
    }
    .namecard.is-in .namecard-status { color:#4ade80; }
    .namecard.is-out { border-color:rgba(148,163,247,.18); }
    .empty { text-align:center; color:var(--muted); font-size:1.1rem; margin-top:2rem; }
    .footer { text-align:center; color:var(--muted); font-size:.8rem; padding:.5rem; }
    /* connection status pill in the top bar */
    .netpill {
      display:flex; align-items:center; gap:.45rem; margin-left:.75rem;
      padding:.4rem .85rem; border-radius:999px; font-size:.9rem; font-weight:700;
      color:var(--muted); background:rgba(148,163,247,.12); border:1px solid rgba(148,163,247,.22);
    }
    .netpill .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
    .netpill.ok { color:#4ade80; }
    .netpill.ok .dot { background:#22c55e; box-shadow:0 0 8px rgba(34,197,94,.85); }
    .netpill.bad { color:#fca5a5; background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.4); }
    .netpill.bad .dot { background:#ef4444; box-shadow:0 0 8px rgba(239,68,68,.85); }
    /* result overlay */
    .overlay {
      position:fixed; inset:0; background:rgba(6,9,20,.72); backdrop-filter:blur(4px); display:none;
      align-items:center; justify-content:center; z-index:50;
    }
    .overlay.show { display:flex; }
    .sheet {
      background:linear-gradient(160deg, rgba(30,38,72,.98), rgba(18,24,50,.98));
      border:1px solid rgba(148,163,247,.18);
      border-radius:24px; padding:2.5rem 2rem;
      width:min(90vw,460px); text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
    }
    .sheet .mark {
      font-size:3.5rem; width:96px; height:96px; line-height:96px;
      border-radius:50%; margin:0 auto 1rem;
    }
    .sheet.ok .mark { color:var(--green); background:rgba(34,197,94,.15); }
    .sheet.err .mark { color:#fca5a5; background:rgba(239,68,68,.15); }
    .sheet .msg { font-size:1.35rem; font-weight:600; }
    /* medication reminder overlay (sits above the clock-result overlay) */
    .overlay.med { z-index:60; }
    .sheet.medsheet .mark { color:#f0abfc; background:rgba(168,85,247,.18); }
    .medlist { list-style:none; padding:0; margin:1.25rem 0 1.5rem; display:flex; flex-direction:column; gap:.7rem; }
    .medlist li {
      font-size:1.4rem; font-weight:800; text-align:center;
      background:rgba(148,163,247,.12); border:1px solid rgba(148,163,247,.22);
      border-radius:14px; padding:.9rem 1rem;
    }
    .medlist li .dose { display:block; font-size:1rem; font-weight:500; color:var(--muted); margin-top:.25rem; }
    .medok {
      border:none; border-radius:14px; background:var(--grad); color:#fff;
      font-size:1.25rem; font-weight:800; padding:.9rem 3rem; cursor:pointer;
      box-shadow:0 6px 18px rgba(99,102,241,.4);
    }
    .medok:active { transform:scale(.97); }
  </style>
</head>
<body>
  <div class="topbar">
    <img class="avatar" id="avatar" src="/ali_photo.jpg" alt="Ali Ismail">
    <span class="brand">TimeKeeper <span class="byline">by Ali Ismail</span></span>
    <div class="netpill" id="netpill"><span class="dot"></span><span id="netlabel">…</span></div>
    <button class="adminbtn" id="adminBtn">Admin</button>
    <div class="topright">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </div>

  <main>
    <p class="prompt">Tap your name to clock in or out</p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No workers yet.</p>
  </main>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet">
      <div class="mark" id="mark"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="overlay med" id="medOverlay">
    <div class="sheet medsheet">
      <div class="mark">💊</div>
      <div class="msg">Medication reminder</div>
      <ul class="medlist" id="medList"></ul>
      <button class="medok" id="medOk">OK</button>
    </div>
    <audio id="medAudio" loop preload="auto" src="/media/med_alert"></audio>
  </div>

  <div class="footer" id="footer">Runs entirely on the tablet.</div>

  <script>
    function tick() {
      var now = new Date();
      var h = now.getHours(), m = now.getMinutes();
      var ap = h >= 12 ? "PM" : "AM"; var hr = h % 12 || 12;
      document.getElementById("clock").textContent =
        hr + ":" + (m < 10 ? "0" + m : m) + " " + ap;
      document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
    }
    tick(); setInterval(tick, 1000);

    function renderWorkers(list) {
      var grid = document.getElementById("grid");
      grid.innerHTML = "";
      document.getElementById("empty").hidden = list.length > 0;
      list.forEach(function (w) {
        var card = document.createElement("div");
        card.className = "namecard " + (w.in ? "is-in" : "is-out");
        card.innerHTML = '<div class="namecard-name"></div><div class="namecard-status"></div>';
        card.querySelector(".namecard-name").textContent = w.name;
        card.querySelector(".namecard-status").textContent = w.in ? "In" : "Out";
        card.addEventListener("click", function () { clock(w.id); });
        grid.appendChild(card);
      });
    }

    function loadWorkers() {
      fetch("/api/workers")
        .then(function (r) { return r.json(); })
        .then(renderWorkers)
        .catch(function () {
          var em = document.getElementById("empty");
          em.hidden = false; em.textContent = "Could not reach the server.";
        });
    }

    function clock(id) {
      fetch("/api/clock?id=" + id, { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(showResult)
        .catch(function () { showResult({ ok:false, message:"Could not reach the server." }); });
    }

    function showResult(res) {
      var sheet = document.getElementById("sheet");
      if (res.ok) {
        sheet.className = "sheet ok";
        document.getElementById("mark").textContent = "✓";
        document.getElementById("msg").textContent =
          res.name + " — clocked " + res.action + " at " + res.time;
      } else {
        sheet.className = "sheet err";
        document.getElementById("mark").textContent = "!";
        document.getElementById("msg").textContent = res.message || "Not allowed.";
      }
      document.getElementById("overlay").classList.add("show");
      setTimeout(function () {
        document.getElementById("overlay").classList.remove("show");
        loadWorkers();
      }, 2500);
    }

    loadWorkers();

    // The Admin button opens admin here in the app (works while pinned).
    document.getElementById("adminBtn").onclick = function () { location.href = "/admin"; };

    // Tapping Ali's photo plays his voice clip (played natively on the tablet).
    document.getElementById("avatar").addEventListener("click", function () {
      fetch("/api/play/ali", { method: "POST" });
    });

    // Live Wi-Fi/LAN status. The top-bar pill is the single status indicator; it
    // polls so a dropped connection shows up and self-heals when Wi-Fi returns —
    // no reboot or app restart needed. The footer just carries the phone address.
    var footer = document.getElementById("footer");
    var netpill = document.getElementById("netpill");
    var netlabel = document.getElementById("netlabel");
    function refreshInfo() {
      fetch("/api/info", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (i) {
          if (i.connected) {
            netpill.className = "netpill ok"; netlabel.textContent = "Online";
            footer.textContent = "On your phone (same Wi-Fi): http://" + i.ip + ":" + i.port + "/admin";
          } else {
            netpill.className = "netpill bad"; netlabel.textContent = "Wi-Fi offline";
            footer.textContent = "Runs entirely on the tablet.";
          }
        })
        .catch(function () {
          netpill.className = "netpill bad"; netlabel.textContent = "Wi-Fi offline";
          footer.textContent = "Runs entirely on the tablet.";
        });
    }
    refreshInfo();
    setInterval(refreshInfo, 5000);

    // ---- Medication reminders ----
    // Poll for a med whose time just arrived; show a full-screen reminder for up
    // to 1 minute with a repeating chime. OK silences and dismisses it. The server
    // marks each reminder fired, so it shows once per scheduled time per day.
    var medOverlay = document.getElementById("medOverlay");
    var medList = document.getElementById("medList");
    var medAudio = document.getElementById("medAudio");
    var medOkBtn = document.getElementById("medOk");
    var medTimer = null;
    var beep = null;   // WebAudio fallback when no med_alert sound file is present

    function startBeep() {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var ctx = new Ctx();
        if (ctx.resume) ctx.resume();
        function ping() {
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = "sine"; o.frequency.value = 880;
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
          o.connect(g); g.connect(ctx.destination);
          o.start(); o.stop(ctx.currentTime + 0.55);
        }
        ping();
        beep = { ctx: ctx, iv: setInterval(ping, 1500) };
      } catch (e) {}
    }
    function stopBeep() {
      if (beep) { clearInterval(beep.iv); try { beep.ctx.close(); } catch (e) {} beep = null; }
    }
    function startSound() {
      var p = medAudio.play();          // prefer the uploaded sound file
      if (p && p.catch) p.catch(function () { startBeep(); });   // none present → chime
    }
    function stopSound() {
      try { medAudio.pause(); medAudio.currentTime = 0; } catch (e) {}
      stopBeep();
    }

    function dismissMeds() {
      medOverlay.classList.remove("show");
      medList.innerHTML = "";
      stopSound();
      if (medTimer) { clearTimeout(medTimer); medTimer = null; }
    }
    medOkBtn.addEventListener("click", dismissMeds);

    function showMeds(meds) {
      meds.forEach(function (m) {
        var li = document.createElement("li");
        li.textContent = m.name;
        if (m.dose) {
          var d = document.createElement("span");
          d.className = "dose"; d.textContent = m.dose;
          li.appendChild(d);
        }
        medList.appendChild(li);
      });
      medOverlay.classList.add("show");
      startSound();
      if (medTimer) clearTimeout(medTimer);
      medTimer = setTimeout(dismissMeds, 60000);   // auto-dismiss after 1 minute
    }

    function checkMeds() {
      fetch("/api/meds/due", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (meds) { if (meds && meds.length) showMeds(meds); })
        .catch(function () {});
    }
    checkMeds();
    setInterval(checkMeds, 15000);
  </script>
</body>
</html>
